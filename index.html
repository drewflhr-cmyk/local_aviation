<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Aviation Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 1rem;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .location-input {
            margin-bottom: 1.5rem;
            font-size: 12px;
            color: #666;
        }

        .location-input input {
            padding: 6px 8px;
            font-size: 12px;
            margin: 0 4px;
            width: 140px;
        }

        .location-input button {
            padding: 6px 12px;
            font-size: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .location-input button:hover {
            background: #0052a3;
        }

        .radar-section {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .radar-container {
            position: relative;
            aspect-ratio: 1;
            background: #000;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 400;
            pointer-events: none;
        }

        .radar-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 500;
            z-index: 101;
            max-width: 140px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #aircraftList, #airportList {
            font-size: 12px;
            max-height: 240px;
            overflow-y: auto;
        }

        .aircraft-item, .airport-item {
            padding: 8px 0;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background 0.2s;
        }

        .aircraft-item:hover, .airport-item:hover {
            background: #f0f0f0;
        }

        .aircraft-item strong, .airport-item strong {
            display: block;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .aircraft-item .detail {
            font-size: 11px;
            color: #888;
        }

        .airport-item {
            color: #1a1a1a;
        }

        .airport-item .distance {
            font-size: 11px;
            color: #888;
        }

        .metar-panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        #metar {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 0.75rem;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #1a1a1a;
            max-height: 120px;
            overflow-y: auto;
            min-height: 60px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin: 0 0 1.5rem 0;
            font-size: 18px;
            color: #1a1a1a;
        }

        .modal-content table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .modal-content td {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-content td:first-child {
            color: #888;
            width: 50%;
        }

        .modal-content td:last-child {
            text-align: right;
            color: #1a1a1a;
            font-weight: 500;
        }

        #diagramLinks {
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
        }

        #diagramLinks a {
            display: inline-block;
            margin: 4px 4px;
            padding: 8px 12px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        #diagramLinks a:hover {
            background: #0052a3;
        }

        .modal-close {
            width: 100%;
            margin-top: 1.5rem;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .error-text {
            color: #d32f2f;
            font-size: 11px;
        }

        .info-text {
            color: #0066cc;
            font-size: 11px;
            margin-top: 0.5rem;
        }

        @media (max-width: 900px) {
            .radar-section {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 1rem;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 1rem;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Aviation Radar</h1>

        <div class="location-input">
            <label>Your Location (Lat/Lon):</label>
            <input type="text" id="latInput" placeholder="27.248805" value="27.248805">
            <input type="text" id="lonInput" placeholder="-80.259035" value="-80.259035">
            <button onclick="updateLocation()">Update</button>
            <button onclick="getGeolocation()">Auto-detect</button>
            <span class="info-text" id="locationStatus"></span>
        </div>

        <div class="radar-section">
            <div class="radar-container">
                <div id="mapContainer"></div>
                <canvas id="radarCanvas"></canvas>
                <div class="radar-status" id="radarStatus">Loading…</div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Aircraft Nearby</div>
                    <div id="aircraftList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">Airports</div>
                    <div id="airportList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="metar-panel">
            <div class="panel-title">METAR - SUA (Stuart)</div>
            <div id="metar">Loading…</div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <h3 id="detailCallsign"></h3>
            <table id="detailTable"></table>
            <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <div class="modal" id="airportModal">
        <div class="modal-content">
            <h3 id="airportName"></h3>
            <table id="airportTable"></table>
            <div id="diagramLinks"></div>
            <button class="modal-close" onclick="document.getElementById('airportModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const aircraftListDiv = document.getElementById('aircraftList');
        const metarDiv = document.getElementById('metar');
        const detailModal = document.getElementById('detailModal');
        const airportModal = document.getElementById('airportModal');
        const statusDiv = document.getElementById('radarStatus');
        const locationStatus = document.getElementById('locationStatus');

        let USER_LAT = 27.248805;
        let USER_LON = -80.259035;
        const RADIUS_MILES = 50;
        const NM_TO_MILES = 1.15078; // Convert nautical miles to statute miles

        // Vercel backend proxy URL - replace with your Vercel project URL
        const BACKEND_URL = 'https://local-aviation.vercel.app/api/proxy?url=';
        const IS_CONFIGURED = BACKEND_URL.includes('YOUR_VERCEL_PROJECT') === false;

        const AIRPORTS = [
            { code: 'SUA', name: 'Witham Field', lat: 27.1817, lon: -80.2211, runways: '09/27' },
            { code: 'X21', name: 'Treasure Coast Intl', lat: 27.2317, lon: -80.4039, runways: '09/27, 18/36' },
            { code: 'OBK', name: 'Okeechobee', lat: 27.0942, lon: -80.8364, runways: '09/27' },
            { code: 'VRB', name: 'Vero Beach Intl', lat: 27.6553, lon: -80.3519, runways: '09/27, 16/34' },
            { code: 'PBI', name: 'Palm Beach Intl (DJT)', lat: 26.6826, lon: -80.0952, runways: '09L/27R, 09R/27L' },
            { code: 'BCT', name: 'Boca Raton', lat: 26.3787, lon: -80.2258, runways: '09/27' },
        ];

        let aircraft = [];
        let hoveredAircraft = null;
        let map = null;
        let airportMarkers = [];

        function getGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('latInput').value = pos.coords.latitude.toFixed(4);
                    document.getElementById('lonInput').value = pos.coords.longitude.toFixed(4);
                    updateLocation();
                    locationStatus.textContent = '✓ Location detected';
                });
            }
        }

        function updateLocation() {
            const lat = parseFloat(document.getElementById('latInput').value);
            const lon = parseFloat(document.getElementById('lonInput').value);

            if (isNaN(lat) || isNaN(lon)) {
                locationStatus.textContent = '✗ Invalid coordinates';
                return;
            }

            USER_LAT = lat;
            USER_LON = lon;
            locationStatus.textContent = `✓ ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

            if (map) {
                map.setView([USER_LAT, USER_LON], 9);
                updateAirportMarkers();
            }

            updateAirportList();
            drawRadar();
            fetchAircraft();
            fetchMETAR();
        }

        function initMap() {
            map = L.map('mapContainer').setView([USER_LAT, USER_LON], 9);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri',
                maxZoom: 18
            }).addTo(map);

            L.circle([USER_LAT, USER_LON], {
                radius: RADIUS_MILES * 1609.34, color: '#0066cc', fill: false, weight: 2, opacity: 0.5
            }).addTo(map);

            L.circleMarker([USER_LAT, USER_LON], {
                radius: 6, color: '#0066cc', fill: true, fillColor: '#0066cc', weight: 2
            }).addTo(map);

            // Redraw canvas when map changes
            map.on('zoom pan', drawRadar);

            updateAirportMarkers();
        }

        function updateAirportMarkers() {
            airportMarkers.forEach(m => map.removeLayer(m));
            airportMarkers = [];

            AIRPORTS.forEach(ap => {
                const marker = L.marker([ap.lat, ap.lon], { title: ap.code }).addTo(map);
                marker.bindPopup(`<strong>${ap.code}</strong><br>${ap.name}`);
                marker.on('click', () => showAirportDetail(ap.code));
                airportMarkers.push(marker);
            });
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvas.width = size;
            canvas.height = size;
            drawRadar();
        }

        function drawRadar() {
            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const pxPerMile = size / (RADIUS_MILES * 2);

            ctx.clearRect(0, 0, size, size);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const radius = (i * 10) * pxPerMile;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 0.5;
            for (let angle = 0; angle < 360; angle += 30) {
                const rad = (angle - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(rad) * (RADIUS_MILES * pxPerMile);
                const y1 = centerY + Math.sin(rad) * (RADIUS_MILES * pxPerMile);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('N', centerX, centerY - (RADIUS_MILES * pxPerMile) - 20);
            ctx.fillText('S', centerX, centerY + (RADIUS_MILES * pxPerMile) + 20);
            ctx.fillText('E', centerX + (RADIUS_MILES * pxPerMile) + 20, centerY);
            ctx.fillText('W', centerX - (RADIUS_MILES * pxPerMile) - 20, centerY);

            drawAircraft(centerX, centerY, pxPerMile);
            drawAirports(centerX, centerY, pxPerMile);
        }

        function drawAircraft(centerX, centerY, pxPerMile) {
            aircraft.forEach((ac, idx) => {
                const acPoint = map.latLngToContainerPoint([ac.latitude, ac.longitude]);
                const x = acPoint.x;
                const y = acPoint.y;

                // Only draw if within canvas bounds (with some margin)
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) {
                    return;
                }

                ctx.fillStyle = hoveredAircraft === idx ? '#ffff00' : '#00ffff';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ac.callsign.substring(0, 2), x, y);
            });
        }

        function drawAirports(centerX, centerY, pxPerMile) {
            AIRPORTS.forEach(ap => {
                const apPoint = map.latLngToContainerPoint([ap.lat, ap.lon]);
                const x = apPoint.x;
                const y = apPoint.y;

                // Only draw if within canvas bounds (with some margin)
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) {
                    return;
                }

                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.rect(x - 6, y - 6, 12, 12);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ap.code.substring(0, 2), x, y);
            });
        }

        // Vercel backend proxy
        async function proxyFetch(apiUrl) {
            const proxyUrl = BACKEND_URL + encodeURIComponent(apiUrl);
            console.log('Fetching via Vercel backend:', apiUrl);

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response;
            } catch (e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        // Use OpenSky Network API
        async function fetchAircraft() {
            try {
                console.log('Fetching aircraft from adsb.lol...');
                const radiusNm = RADIUS_MILES / NM_TO_MILES;
                const url = `https://api.adsb.lol/v2/point/${USER_LAT}/${USER_LON}/${radiusNm}`;

                const response = await proxyFetch(url);
                const data = await response.json();

                console.log('Aircraft received:', data.ac?.length || 0);

                if (!data.ac || data.ac.length === 0) {
                    aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft detected</p>';
                    aircraft = [];
                    drawRadar();
                    statusDiv.textContent = 'Radar: Live (none)';
                    statusDiv.style.background = 'rgba(100,150,0,0.7)';
                    return;
                }

                aircraft = data.ac.map(a => {
                    const distMiles = (a.dst || 0) * NM_TO_MILES;

                    return {
                        callsign: (a.flight || a.r || a.hex || 'Unknown').trim().toUpperCase(),
                        icao: a.hex || 'N/A',
                        registration: a.r || 'N/A',
                        latitude: a.lat || 0,
                        longitude: a.lon || 0,
                        altitude: a.alt_baro !== undefined ? a.alt_baro : a.alt_geom,
                        altitudeText: a.alt_baro === 'ground' ? 'GND' : (a.alt_baro || a.alt_geom || '?'),
                        velocity: a.gs ? Math.round(a.gs) : -1,
                        track: a.track ? Math.round(a.track) : -1,
                        verticalRate: a.baro_rate || a.geom_rate || 0,
                        distance: distMiles,
                        bearing: a.dir !== undefined ? Math.round(a.dir) : -1,
                        squawk: a.squawk || '-',
                        category: a.category || '-',
                        type: a.t || '-'
                    };
                }).filter(ac => ac.latitude && ac.longitude);

                // Sort by distance
                aircraft.sort((a, b) => a.distance - b.distance);

                console.log('Filtered aircraft:', aircraft.length);
                updateAircraftList();
                drawRadar();
                statusDiv.textContent = `Radar: Live (${aircraft.length})`;
                statusDiv.style.background = 'rgba(0,150,0,0.7)';
            } catch (e) {
                console.error('Aircraft error:', e);
                statusDiv.textContent = 'Aircraft: Error';
                statusDiv.style.background = 'rgba(150,0,0,0.7)';
                aircraftListDiv.innerHTML = '<p class="error-text">Error loading aircraft data</p>';
            }
        }

        function updateAircraftList() {
            const sorted = aircraft.slice(0, 12);

            if (sorted.length === 0) {
                aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft nearby</p>';
            } else {
                aircraftListDiv.innerHTML = sorted.map((ac, idx) => `
                    <div class="aircraft-item"
                         onmouseover="hoveredAircraft = ${idx}; drawRadar();"
                         onmouseout="hoveredAircraft = null; drawRadar();"
                         onclick="showAircraftDetail(${idx});">
                        <strong>${ac.callsign}</strong>
                        <div class="detail">${ac.distance.toFixed(1)} mi • ${ac.altitudeText} ft</div>
                    </div>
                `).join('');
            }
        }

        function updateAirportList() {
            const sorted = AIRPORTS.map(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                return { ...ap, dist };
            }).sort((a, b) => a.dist - b.dist);

            document.getElementById('airportList').innerHTML = sorted.map(ap => `
                <div class="airport-item" onclick="showAirportDetail('${ap.code}')">
                    <strong>${ap.code}</strong> ${ap.name}
                    <div class="distance">${ap.dist.toFixed(1)} mi</div>
                </div>
            `).join('');
        }

        function showAircraftDetail(idx) {
            const ac = aircraft[idx];
            const bearing = ac.bearing >= 0 ? ac.bearing : 0;
            const bearingText = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round((bearing + 360) % 360 / 22.5) % 16];

            document.getElementById('detailCallsign').textContent = ac.callsign || 'Unknown';
            const rows = `
                <tr><td>Registration</td><td>${ac.registration}</td></tr>
                <tr><td>ICAO (Hex)</td><td style="font-family: monospace;">${ac.icao}</td></tr>
                <tr><td>Latitude</td><td>${ac.latitude.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ac.longitude.toFixed(4)}°</td></tr>
                <tr><td>Altitude</td><td>${ac.altitudeText} ft</td></tr>
                <tr><td>Velocity</td><td>${ac.velocity >= 0 ? ac.velocity + ' kt' : 'N/A'}</td></tr>
                <tr><td>Track</td><td>${ac.track >= 0 ? ac.track + '°' : 'N/A'}</td></tr>
                <tr><td>Vertical Rate</td><td>${ac.verticalRate ? Math.round(ac.verticalRate) + ' ft/m' : 'N/A'}</td></tr>
                <tr><td>Distance</td><td>${ac.distance.toFixed(1)} miles</td></tr>
                <tr><td>Bearing</td><td>${ac.bearing >= 0 ? ac.bearing + '° (' + bearingText + ')' : 'N/A'}</td></tr>
                <tr><td>Squawk</td><td>${ac.squawk}</td></tr>
                <tr><td>Type</td><td>${ac.type}</td></tr>
            `;
            document.getElementById('detailTable').innerHTML = rows;
            detailModal.classList.add('active');
        }

        function showAirportDetail(code) {
            const ap = AIRPORTS.find(a => a.code === code);
            if (!ap) return;

            const dlat = ap.lat - USER_LAT;
            const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
            const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;

            document.getElementById('airportName').textContent = `${ap.code} - ${ap.name}`;
            const rows = `
                <tr><td>Latitude</td><td>${ap.lat.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ap.lon.toFixed(4)}°</td></tr>
                <tr><td>Distance</td><td>${dist.toFixed(1)} miles</td></tr>
                <tr><td>Runways</td><td>${ap.runways}</td></tr>
            `;
            document.getElementById('airportTable').innerHTML = rows;

            const diagLinks = `
                <strong style="display: block; margin-bottom: 10px; text-align: center;">Airport Diagrams & Info:</strong>
                <a href="https://www.airnav.com/airport/${code}" target="_blank">AirNav</a>
                <a href="https://skyvector.com/?ll=${ap.lat},${ap.lon}&chart=301&zoom=2" target="_blank">SkyVector (VFR)</a>
                <a href="https://maps.google.com/?q=${ap.lat},${ap.lon}" target="_blank">Google Maps</a>
            `;
            document.getElementById('diagramLinks').innerHTML = diagLinks;

            airportModal.classList.add('active');
        }

        async function fetchMETAR() {
            try {
                console.log('Fetching METAR...');
                const url = 'https://avwx.rest/api/metar/KSUA?options=info,translate';

                const response = await proxyFetch(url);
                const data = await response.json();

                console.log('METAR response:', data);

                if (data.raw) {
                    metarDiv.textContent = data.raw;
                } else {
                    metarDiv.textContent = 'METAR unavailable';
                }
            } catch (e) {
                console.error('METAR error:', e);
                metarDiv.innerHTML = '<span style="color: #999;">METAR service unavailable</span>';
            }
        }

        canvas.addEventListener('click', (e) => {
            const containerRect = container.getBoundingClientRect();
            const clickX = e.clientX - containerRect.left;
            const clickY = e.clientY - containerRect.top;

            // Check aircraft
            for (let i = 0; i < aircraft.length; i++) {
                const ac = aircraft[i];
                const acPoint = map.latLngToContainerPoint([ac.latitude, ac.longitude]);

                if (Math.hypot(clickX - acPoint.x, clickY - acPoint.y) < 12) {
                    showAircraftDetail(i);
                    return;
                }
            }

            // Check airports
            for (let i = 0; i < AIRPORTS.length; i++) {
                const ap = AIRPORTS[i];
                const apPoint = map.latLngToContainerPoint([ap.lat, ap.lon]);

                if (Math.hypot(clickX - apPoint.x, clickY - apPoint.y) < 12) {
                    showAirportDetail(ap.code);
                    return;
                }
            }
        });

        window.addEventListener('resize', resizeCanvas);

        initMap();
        resizeCanvas();
        updateAirportList();
        fetchAircraft();
        fetchMETAR();

        // Refresh aircraft every 10 seconds, METAR every 10 minutes
        setInterval(fetchAircraft, 10000);
        setInterval(fetchMETAR, 600000);

        console.log('Radar ready - using adsb.lol API');
    </script>
</body>
</html>
