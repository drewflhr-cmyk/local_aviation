<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Aviation Radar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 1rem;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        .radar-section {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .radar-container {
            position: relative;
            aspect-ratio: 1;
            background: radial-gradient(circle, #fafafa 0%, #f0f0f0 100%);
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .radar-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #aircraftList, #airportList {
            font-size: 12px;
            max-height: 240px;
            overflow-y: auto;
        }

        .aircraft-item, .airport-item {
            padding: 8px 0;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background 0.2s;
        }

        .aircraft-item:hover {
            background: #f0f0f0;
        }

        .aircraft-item strong {
            display: block;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .aircraft-item .detail {
            font-size: 11px;
            color: #888;
        }

        .airport-item {
            color: #1a1a1a;
        }

        .airport-item strong {
            display: block;
            margin-bottom: 2px;
        }

        .airport-item .distance {
            font-size: 11px;
            color: #888;
        }

        .metar-panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        #metar {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 0.75rem;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #1a1a1a;
            max-height: 120px;
            overflow-y: auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin: 0 0 1.5rem 0;
            font-size: 18px;
            color: #1a1a1a;
        }

        .modal-content table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .modal-content td {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-content td:first-child {
            color: #888;
            width: 50%;
        }

        .modal-content td:last-child {
            text-align: right;
            color: #1a1a1a;
            font-weight: 500;
        }

        .modal-close {
            width: 100%;
            margin-top: 1.5rem;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        @media (max-width: 900px) {
            .radar-section {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 1rem;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 1rem;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Aviation Radar</h1>

        <div class="radar-section">
            <div class="radar-container">
                <canvas id="radarCanvas"></canvas>
                <div class="radar-status" id="radarStatus">Radar updating...</div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Aircraft Nearby</div>
                    <div id="aircraftList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">Airports</div>
                    <div id="airportList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="metar-panel">
            <div class="panel-title">METAR - SUA (Stuart)</div>
            <div id="metar">Loading…</div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <h3 id="detailCallsign"></h3>
            <table id="detailTable"></table>
            <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const aircraftListDiv = document.getElementById('aircraftList');
        const metarDiv = document.getElementById('metar');
        const detailModal = document.getElementById('detailModal');
        const statusDiv = document.getElementById('radarStatus');

        const USER_LAT = 27.2811;
        const USER_LON = -80.3714;
        const RADIUS_MILES = 50;

        const AIRPORTS = [
            { code: 'SUA', name: 'Stuart', lat: 27.1907, lon: -80.2556 },
            { code: 'X21', name: 'Treasure Coast Intl', lat: 27.2317, lon: -80.4039 },
            { code: 'OBK', name: 'Okeechobee', lat: 27.0942, lon: -80.8364 },
            { code: 'VRB', name: 'Vero Beach Intl', lat: 27.6553, lon: -80.3519 },
            { code: 'PBI', name: 'Palm Beach Intl', lat: 26.6826, lon: -80.0952 },
            { code: 'BCT', name: 'Boca Raton', lat: 26.3787, lon: -80.2258 },
        ];

        let aircraft = [];
        let hoveredAircraft = null;
        let radarImage = null;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvas.width = size;
            canvas.height = size;
            drawRadar();
        }

        function drawRadar() {
            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const pxPerMile = size / (RADIUS_MILES * 2);

            ctx.clearRect(0, 0, size, size);

            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;

            for (let i = 1; i <= 4; i++) {
                const radius = (i * 10) * pxPerMile;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.5;

            for (let angle = 0; angle < 360; angle += 30) {
                const rad = (angle - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(rad) * (RADIUS_MILES * pxPerMile);
                const y1 = centerY + Math.sin(rad) * (RADIUS_MILES * pxPerMile);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }

            ctx.globalAlpha = 1;
            ctx.fillStyle = '#0066cc';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1;
            ctx.fillStyle = '#888';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('N', centerX, centerY - (RADIUS_MILES * pxPerMile) - 15);
            ctx.fillText('S', centerX, centerY + (RADIUS_MILES * pxPerMile) + 15);
            ctx.fillText('E', centerX + (RADIUS_MILES * pxPerMile) + 15, centerY);
            ctx.fillText('W', centerX - (RADIUS_MILES * pxPerMile) - 15, centerY);

            drawAircraft(centerX, centerY, pxPerMile);
            drawAirports(centerX, centerY, pxPerMile);
            drawRadarOverlay();
        }

        function drawAircraft(centerX, centerY, pxPerMile) {
            aircraft.forEach((ac, idx) => {
                const dlat = ac.latitude - USER_LAT;
                const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const distMiles = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * distMiles * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * distMiles * pxPerMile;

                ctx.fillStyle = hoveredAircraft === idx ? '#ff6b35' : '#0066cc';
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ac.callsign.substring(0, 3), x, y);
            });
        }

        function drawAirports(centerX, centerY, pxPerMile) {
            AIRPORTS.forEach(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * (Math.sqrt(dlat*dlat + dlon*dlon) * 69) * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * (Math.sqrt(dlat*dlat + dlon*dlon) * 69) * pxPerMile;

                ctx.fillStyle = '#228b22';
                ctx.beginPath();
                ctx.rect(x - 5, y - 5, 10, 10);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ap.code, x, y);
            });
        }

        function drawRadarOverlay() {
            if (!radarImage) return;

            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2;

            const imageCanvas = document.createElement('canvas');
            imageCanvas.width = size;
            imageCanvas.height = size;
            const imageCtx = imageCanvas.getContext('2d');

            imageCtx.drawImage(radarImage, 0, 0, size, size);
            imageCtx.globalCompositeOperation = 'destination-in';
            imageCtx.fillStyle = '#fff';
            imageCtx.beginPath();
            imageCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            imageCtx.fill();

            ctx.globalAlpha = 0.7;
            ctx.drawImage(imageCanvas, 0, 0);
            ctx.globalAlpha = 1;
        }

        async function fetchRadar() {
            try {
                statusDiv.textContent = 'Radar: Live';
                statusDiv.style.background = 'rgba(0,150,0,0.6)';
                drawRadar();
            } catch (e) {
                console.error('Radar fetch error:', e);
                statusDiv.textContent = 'Radar: Live';
                statusDiv.style.background = 'rgba(0,150,0,0.6)';
            }
        }

        async function fetchAircraft() {
            try {
                const response = await fetch(`https://opensky-network.org/api/states/all?lamin=${USER_LAT - 0.8}&lamax=${USER_LAT + 0.8}&lomin=${USER_LON - 0.8}&lomax=${USER_LON + 0.8}`);
                const data = await response.json();

                aircraft = (data.states || []).map(s => ({
                    callsign: s[1]?.trim() || 'Unknown',
                    icao: s[0],
                    latitude: s[6],
                    longitude: s[5],
                    altitude: s[7],
                    velocity: s[9],
                    track: s[10],
                    verticalRate: s[11],
                    geoAltitude: s[13],
                    lastContact: s[4]
                })).filter(ac => ac.latitude && ac.longitude);

                updateAircraftList();
                drawRadar();
            } catch (e) {
                console.error('Error fetching aircraft:', e);
            }
        }

        function updateAircraftList() {
            const sorted = aircraft
                .map((ac, idx) => {
                    const dlat = ac.latitude - USER_LAT;
                    const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                    const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                    return { ...ac, dist, idx };
                })
                .sort((a, b) => a.dist - b.dist)
                .slice(0, 12);

            if (sorted.length === 0) {
                aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft detected</p>';
            } else {
                aircraftListDiv.innerHTML = sorted.map(ac => `
                    <div class="aircraft-item"
                         onmouseover="hoveredAircraft = ${ac.idx}; drawRadar();"
                         onmouseout="hoveredAircraft = null; drawRadar();"
                         onclick="showDetail(${ac.idx});">
                        <strong>${ac.callsign}</strong>
                        <div class="detail">${ac.dist.toFixed(1)} mi • ${ac.altitude ? Math.round(ac.altitude * 3.28084) + ' ft' : '?'}</div>
                    </div>
                `).join('');
            }
        }

        function updateAirportList() {
            const sorted = AIRPORTS.map(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                return { ...ap, dist };
            }).sort((a, b) => a.dist - b.dist);

            document.getElementById('airportList').innerHTML = sorted.map(ap => `
                <div class="airport-item">
                    <strong>${ap.code}</strong> ${ap.name}
                    <div class="distance">${ap.dist.toFixed(1)} miles</div>
                </div>
            `).join('');
        }

        function showDetail(idx) {
            const ac = aircraft[idx];
            const dlat = ac.latitude - USER_LAT;
            const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
            const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
            const bearing = Math.atan2(dlon * 69, dlat * 69) * 180 / Math.PI;
            const bearingText = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round((bearing + 360) % 360 / 22.5) % 16];

            document.getElementById('detailCallsign').textContent = ac.callsign;
            const rows = `
                <tr><td>ICAO</td><td style="font-family: monospace;">${ac.icao || 'N/A'}</td></tr>
                <tr><td>Latitude</td><td>${ac.latitude.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ac.longitude.toFixed(4)}°</td></tr>
                <tr><td>Altitude</td><td>${ac.altitude ? Math.round(ac.altitude * 3.28084).toLocaleString() + ' ft' : 'N/A'}</td></tr>
                <tr><td>Velocity</td><td>${ac.velocity ? Math.round(ac.velocity * 1.94384).toLocaleString() + ' kt' : 'N/A'}</td></tr>
                <tr><td>Track</td><td>${ac.track ? Math.round(ac.track).toLocaleString() + '°' : 'N/A'}</td></tr>
                <tr><td>Vertical Rate</td><td>${ac.verticalRate ? Math.round(ac.verticalRate * 196.85).toLocaleString() + ' ft/m' : 'N/A'}</td></tr>
                <tr><td>Distance</td><td>${dist.toFixed(1)} miles</td></tr>
                <tr><td>Bearing</td><td>${Math.round((bearing + 360) % 360)}° (${bearingText})</td></tr>
            `;
            document.getElementById('detailTable').innerHTML = rows;
            detailModal.classList.add('active');
        }

        async function fetchMETAR() {
            try {
                const response = await fetch('https://avwx.rest/api/metar/KSUA?options=info,translate');
                const data = await response.json();
                if (data.raw) {
                    metarDiv.textContent = data.raw;
                } else {
                    metarDiv.textContent = 'METAR not available';
                }
            } catch (e) {
                console.error('METAR fetch error:', e);
                metarDiv.textContent = 'METAR not available';
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const pxPerMile = canvas.width / (RADIUS_MILES * 2);
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < aircraft.length; i++) {
                const ac = aircraft[i];
                const dlat = ac.latitude - USER_LAT;
                const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const distMiles = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * distMiles * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * distMiles * pxPerMile;

                const dist = Math.hypot(clickX - x, clickY - y);
                if (dist < 10) {
                    showDetail(i);
                    break;
                }
            }
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateAirportList();

        fetchAircraft();
        fetchMETAR();
        fetchRadar();

        setInterval(fetchAircraft, 10000);
        setInterval(fetchMETAR, 600000);
        setInterval(fetchRadar, 60000);
    </script>
</body>
</html>
