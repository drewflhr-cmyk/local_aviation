<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Aviation Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #1e3c72 0%, #4a90e2 25%, #87ceeb 50%, #e0f6ff 75%, #f0f8ff 100%);
            background-attachment: fixed;
            padding: 1rem;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        /* Title line: title on the left, clock (local + UTC) on the right, same font size */
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            column-gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .title-row h1 {
            margin-bottom: 0;
        }

        .clock {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* Weather row: wind (left) | Flight Tracking button (center) | temp + dew point (right) */
        .track-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin: 0 0;
        }

        .track-center {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .wx {
            flex: 0 0 auto;
            width: 120px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            color: #1a1a1a;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .wx.wx-left { text-align: left; }
        .wx.wx-right { text-align: right; }

        /* Reference arrows sitting on top of the map */
        .map-arrow {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
            z-index: 500;
            pointer-events: none;
        }

        .map-arrow svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.4s;
        }
        .map-arrow-label {
    position: absolute;
    top: -15px;               /* sits just above the circle */
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;   /* dark outline so it reads on any background */
}

        #northArrow { top: 44px; right: 12px; }      /* just under the "Radar: Live" box */
        #windArrow  { bottom: 28px; right: 12px; }   /* bottom right, above the map credit line */

        .airway-label {
            background: rgba(0,0,0,0.55);
            border: none;
            color: #d0d0d0;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 4px;
            box-shadow: none;
        }

        .airway-label::before { display: none; }

        .location-input {
            margin-bottom: 1.5rem;
            font-size: 12px;
            color: #666;
        }

        .location-input input {
            padding: 6px 8px;
            font-size: 12px;
            margin: 0 4px;
            width: 140px;
        }

        .location-input button {
            padding: 6px 12px;
            font-size: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .location-input button:hover {
            background: #0052a3;
        }

        .radar-section {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .radar-container {
            position: relative;
            aspect-ratio: 1;
            background: #000;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 400;
            pointer-events: none;
        }

        .radar-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 500;
            z-index: 101;
            max-width: 140px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scroll-hint {
            font-size: 11px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            color: #999;
        }

        #aircraftList, #airportList {
            font-size: 12px;
            max-height: 360px;
            overflow-y: auto;
        }

        .aircraft-item, .airport-item {
            padding: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .airport-separator {
            border-bottom: 1px solid #cccccc;
            margin: 0.5rem 0 0 0;
        }

        .aircraft-item:hover, .airport-item:hover {
            background: #f0f0f0;
        }

        .aircraft-item.tracked {
            background: #ffebee;
            border-left: 3px solid #d32f2f;
            padding-left: 5px;
        }

        .aircraft-item.tracked strong {
            color: #d32f2f;
        }

        .aircraft-item strong, .airport-item strong {
            display: block;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .aircraft-item .detail {
            font-size: 11px;
            color: #888;
        }

        .airport-item {
            color: #1a1a1a;
        }

        .airport-item .distance {
            font-size: 11px;
            color: #888;
        }

        .ksua-live-atc-link {
            display: block;
            margin-top: 1rem;
            padding: 10px;
            background: #00a3cc;
            color: white;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
            text-decoration: none;
            border: none;
            font-family: inherit;
        }

        .ksua-live-atc-link:hover {
            background: #0084a3;
        }

        .ksua-weather-link {
            display: block;
            margin-top: 0.5rem;
            padding: 10px;
            background: #0066cc;
            color: white;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
            text-decoration: none;
            border: none;
            font-family: inherit;
        }

        .ksua-weather-link:hover {
            background: #0052a3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin: 0 0 1.5rem 0;
            font-size: 18px;
            color: #1a1a1a;
        }

        .modal-content table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .modal-content td {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-content td:first-child {
            color: #888;
            width: 50%;
        }

        .modal-content td:last-child {
            text-align: right;
            color: #1a1a1a;
            font-weight: 500;
        }

        #diagramLinks {
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
        }

        #diagramLinks a {
            display: inline-block;
            margin: 4px 4px;
            padding: 8px 12px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        #diagramLinks a:hover {
            background: #0052a3;
        }

        .modal-close {
            width: 100%;
            margin-top: 1.5rem;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .error-text {
            color: #d32f2f;
            font-size: 11px;
        }

        .info-text {
            color: #0066cc;
            font-size: 11px;
            margin-top: 0.5rem;
        }

        @media (max-width: 1200px) {
            .radar-section {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            /* Title and clock share one line on a phone */
            .title-row {
                flex-wrap: nowrap;
                column-gap: 0.5rem;
                margin-bottom: 0.25rem;
            }

            h1 {
                font-size: 17px;
                white-space: nowrap;
            }

            .clock {
                font-size: 17px;
            }

            .wx {
                width: 90px;
                font-size: 12px;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 1rem;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-row">
            <h1>Local Aviation Radar</h1>
            <div class="clock" id="clock" title="Local time (UTC time)">--:-- (--:--Z)</div>
        </div>

        <!-- SIGMET alert box (left) and always-on AWC map link box (right), touching, same size -->
        <div style="display: flex; align-items: stretch; margin-bottom: 0;">
            <!-- The whole SIGMET box is now a link (an <a> tag) to the AWC SIGMET map; the JS still fills in sigmetDisplay as before -->
            <a id="sigmetPanel" href="https://aviationweather.gov/gfa/#sigmet" target="_blank" rel="noopener" style="flex: 1; display: block; padding: 0.75rem; background: #fff; border-radius: 8px 0 0 8px; border: 1px solid #e0e0e0; font-size: 12px; color: #666; overflow: hidden; text-align: center; text-decoration: none; cursor: pointer;">
                <div id="sigmetDisplay" style="white-space: nowrap; font-size: 12px;">SIGMETs: loading...</div>
            </a>
            <a id="awcMapLink" href="https://aviationweather.gov/gfa/#obs" target="_blank" rel="noopener" style="flex: 1; padding: 0.75rem; background: #fff; border-radius: 0 8px 8px 0; border: 1px solid #e0e0e0; border-left: none; font-size: 12px; font-weight: bold; color: #1565c0; text-decoration: none; text-align: center; display: block;">AWC Map FL</a>
        </div>

        <div class="track-row">
            <div class="wx wx-left" title="KSUA wind (METAR)">
                <div id="wxSpeed">Wind --</div>
                <div id="wxDir">Dir --</div>
            </div>
            <div class="track-center">
            <a href="https://www.flightaware.com" target="_blank" style="display: inline-block; padding: 12px 20px; background: #ff6600; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px; transition: background 0.2s;" onmouseover="this.style.background='#e65a00'" onmouseout="this.style.background='#ff6600'">Flight Tracking Information</a>
            </div>
            <div class="wx wx-right" title="KSUA temperature and dew point (METAR)">
                <div id="wxTemp">Temp --</div>
                <div id="wxDew">Dew pt --</div>
            </div>
        </div>

        <div class="radar-section">
            <div class="radar-container">
                <div id="mapContainer"></div>
                <canvas id="radarCanvas"></canvas>
                <div class="radar-status" id="radarStatus">Loading…</div>
                <!-- Fixed arrow: always points 50 degrees clockwise from north -->
                <div class="map-arrow" id="northArrow" title="Fixed reference arrow, 50° from north">
                    <svg viewBox="0 0 40 40" style="transform: rotate(50deg)"><g fill="#000" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="32" x2="20" y2="12"/><polygon points="20,5 12,18 28,18"/></g></svg>
                </div>
                <!-- Live wind arrow (KSUA): points the way the wind is blowing toward -->
                <div class="map-arrow" id="windArrow" title="Wind" style="display:none">
                    <span class="map-arrow-label">wind</span>
                    <svg viewBox="0 0 40 40" id="windArrowSvg"><g fill="#0066cc" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="32" x2="20" y2="12"/><polygon points="20,5 12,18 28,18"/></g></svg>
                </div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">
                        <span>Aircraft Nearby</span>
                        <span class="scroll-hint">(Scroll for more)</span>
                    </div>
                    <div id="aircraftList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">
                        <span>Airports</span>
                        <span class="scroll-hint">(Scroll for more)</span>
                    </div>
                    <div id="airportList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="location-input" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd;">
            <label>Your Location (Lat/Lon):</label>
            <input type="text" id="latInput" placeholder="27.248805" value="27.248805">
            <input type="text" id="lonInput" placeholder="-80.259035" value="-80.259035">
            <button onclick="updateLocation()">Update</button>
            <button onclick="getGeolocation()">Auto-detect</button>
            <span class="info-text" id="locationStatus"></span>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <h3 id="detailCallsign"></h3>
            <table id="detailTable"></table>
            <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <div class="modal" id="airportModal">
        <div class="modal-content">
            <h3 id="airportName"></h3>
            <table id="airportTable"></table>
            <div id="diagramLinks"></div>
            <button class="modal-close" onclick="document.getElementById('airportModal').classList.remove('active')">Close</button>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const aircraftListDiv = document.getElementById('aircraftList');
        // Store METAR data for modal
        let ksuaMetarData = null;
        let ksuaWeatherLink = 'https://aviationweather.gov/data/metar/?decoded=1&ids=KSUA';
        const detailModal = document.getElementById('detailModal');
        const airportModal = document.getElementById('airportModal');
        const statusDiv = document.getElementById('radarStatus');
        const locationStatus = document.getElementById('locationStatus');
        const ksuaWeatherUrl = 'https://aviationweather.gov/data/metar/?decoded=1&ids=KSUA&taf=1';

        let USER_LAT = 27.248805;
        let USER_LON = -80.259035;
        const RADIUS_MILES = 50;
        const NM_TO_MILES = 1.15078; // Convert nautical miles to statute miles

        // Aircraft tracking
        const TRACKED_AIRCRAFT = 'N42675';
        const NTFY_URL = 'https://ntfy.sh/n42675';
        let notifiedAircraft = {}; // Track which aircraft we've already notified about

        // Radar sweep animation
        const RADAR_SWEEP_TIME_MS = 10000; // 10 seconds for full rotation (adjust this to change speed)
        let radarSweepAngle = 0;

        // Vercel backend proxy URL - replace with your Vercel project URL
        const BACKEND_URL = 'https://local-aviation.vercel.app/api/proxy?url=';
        const IS_CONFIGURED = BACKEND_URL.includes('YOUR_VERCEL_PROJECT') === false;

        const AIRPORTS = [
            { code: 'SUA', name: 'Witham Field', lat: 27.1817, lon: -80.2211, runways: '09/27' },
            { code: 'KFPR', name: 'Treasure Coast Intl', lat: 27.495, lon: -80.368, runways: '09/27, 18/36' },
            { code: 'OBK', name: 'Okeechobee County', lat: 27.266, lon: -80.851, runways: '09/27' },
            { code: 'VRB', name: 'Vero Beach Regional', lat: 27.656, lon: -80.418, runways: '09/27, 16/34' },
            { code: 'PBI', name: 'Palm Beach Intl', lat: 26.683, lon: -80.096, runways: '09L/27R, 09R/27L' },
            { code: 'BCT', name: 'Boca Raton', lat: 26.379, lon: -80.108, runways: '09/27' },
        ];

        // Aircraft sitting on the ground longer than this are dropped from the list and map
        const GROUND_HIDE_MS = 60 * 1000;
        const groundSince = {};   // icao hex -> time we first saw it on the ground

        // KSUA weather (wind, temperature, dew point) comes from its METAR
        const WIND_STATION = 'KSUA';
        const WIND_ARROW_POINTS_DOWNWIND = true;  // true = arrow points where the wind is blowing TO

        // Airways drawn in grey on the map (fix-to-fix positions from the FAA's published airway data).
        // Each list is [latitude, longitude] pairs, in order along the route.
        const AIRWAYS = {
            'V3': [
                [25.800, -80.349], [25.871, -80.301], [25.943, -80.254], [26.014, -80.206], [26.074, -80.166],
                [26.157, -80.156], [26.239, -80.145], [26.322, -80.134], [26.405, -80.123], [26.488, -80.112],
                [26.570, -80.101], [26.653, -80.090], [26.680, -80.086],
                [26.759, -80.118], [26.837, -80.149], [26.915, -80.181], [26.960, -80.199],
                [27.039, -80.230], [27.117, -80.262], [27.193, -80.293],
                [27.272, -80.322], [27.351, -80.352], [27.430, -80.381], [27.509, -80.411], [27.588, -80.440],
                [27.667, -80.470], [27.746, -80.500], [27.825, -80.529], [27.904, -80.559], [27.983, -80.589],
                [28.062, -80.619], [28.105, -80.635],
                [28.184, -80.666], [28.263, -80.697], [28.341, -80.729], [28.420, -80.760], [28.435, -80.765],
                [28.513, -80.797], [28.517, -80.798]
            ],
            'V492': [
                [26.680, -80.086], [26.763, -80.093], [26.846, -80.099], [26.929, -80.106], [26.992, -80.111],
                [27.075, -80.117], [27.158, -80.124], [27.241, -80.130], [27.253, -80.131],
                [27.336, -80.138], [27.419, -80.145], [27.468, -80.148],
                [27.537, -80.201], [27.606, -80.253], [27.608, -80.255],
                [27.677, -80.307], [27.746, -80.360], [27.815, -80.413], [27.884, -80.465], [27.953, -80.518],
                [28.022, -80.571], [28.091, -80.624], [28.105, -80.635]
            ]
        };

        let aircraft = [];
        let hoveredAircraft = null;
        let map = null;
        let airportMarkers = [];

        function getGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('latInput').value = pos.coords.latitude.toFixed(4);
                    document.getElementById('lonInput').value = pos.coords.longitude.toFixed(4);
                    updateLocation();
                    locationStatus.textContent = '✓ Location detected';
                });
            }
        }

        function updateLocation() {
            const lat = parseFloat(document.getElementById('latInput').value);
            const lon = parseFloat(document.getElementById('lonInput').value);

            if (isNaN(lat) || isNaN(lon)) {
                locationStatus.textContent = '✗ Invalid coordinates';
                return;
            }

            USER_LAT = lat;
            USER_LON = lon;
            locationStatus.textContent = `✓ ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

            if (map) {
                map.setView([USER_LAT, USER_LON], 9);
                updateAirportMarkers();
            }

            updateAirportList();
            drawRadar();
            fetchAircraft();
        }

        function initMap() {
            map = L.map('mapContainer').setView([USER_LAT, USER_LON], 9);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri',
                maxZoom: 18
            }).addTo(map);

            // Add weather radar layer
            initWeatherRadar();

            L.circle([USER_LAT, USER_LON], {
                radius: RADIUS_MILES * 1609.34, color: '#0066cc', fill: false, weight: 2, opacity: 0.5
            }).addTo(map);

            L.circleMarker([USER_LAT, USER_LON], {
                radius: 6, color: '#0066cc', fill: true, fillColor: '#0066cc', weight: 2
            }).addTo(map);

            addAirways();

            // Redraw canvas when map changes
            map.on('zoom pan', drawRadar);

            updateAirportMarkers();
        }

        // Draws each airway as a grey line (with a thin dark edge so it shows on the satellite picture).
        // They are Leaflet map layers, so they move and zoom together with the map.
        function addAirways() {
            Object.keys(AIRWAYS).forEach(name => {
                const pts = AIRWAYS[name];
                L.polyline(pts, { color: '#000', weight: 6, opacity: 0.35, interactive: false }).addTo(map);
                L.polyline(pts, { color: '#b0b0b0', weight: 3.5, opacity: 0.95, interactive: false }).addTo(map);
                // Label near the middle of the route that is closest to home
                let best = pts[0], bestD = 1e9;
                pts.forEach(p => {
                    const d = Math.hypot(p[0] - USER_LAT, (p[1] - USER_LON) * Math.cos(USER_LAT * Math.PI / 180));
                    if (d < bestD) { bestD = d; best = p; }
                });
                L.tooltip({ permanent: true, direction: 'right', offset: [4, 0], className: 'airway-label' })
                    .setLatLng(best).setContent(name).addTo(map);
            });
        }

        function resizeCanvas() {

        function drawRadarSweep(centerX, centerY, pxPerMile) {
            const maxRadius = RADIUS_MILES * pxPerMile;

            // Update sweep angle (convert ms to degrees: 360 degrees / RADAR_SWEEP_TIME_MS)
            radarSweepAngle = (Date.now() % RADAR_SWEEP_TIME_MS) / RADAR_SWEEP_TIME_MS * 360;
            const rad = (radarSweepAngle - 90) * Math.PI / 180; // -90 to start at top

            const sweepEndX = centerX + Math.cos(rad) * maxRadius;
            const sweepEndY = centerY + Math.sin(rad) * maxRadius;

            // Draw fading trail (multiple lines with decreasing opacity)
            for (let i = 0; i < 15; i++) {
                const trailAngle = radarSweepAngle - (i * 3); // 3 degrees apart
                const trailRad = (trailAngle - 90) * Math.PI / 180;
                const trailEndX = centerX + Math.cos(trailRad) * maxRadius;
                const trailEndY = centerY + Math.sin(trailRad) * maxRadius;

                // Fade from bright green to transparent
                const opacity = (15 - i) / 15 * 0.6;
                ctx.strokeStyle = `rgba(0, 187, 0, ${opacity})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(trailEndX, trailEndY);
                ctx.stroke();
            }

            // Draw bright main sweep arm with glow
            ctx.shadowColor = 'rgba(0, 200, 0, 0.6)';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#00bb00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(sweepEndX, sweepEndY);
            ctx.stroke();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        function drawRadar() {
            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const pxPerMile = size / (RADIUS_MILES * 2);

            ctx.clearRect(0, 0, size, size);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const radius = (i * 10) * pxPerMile;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 0.5;
            for (let angle = 0; angle < 360; angle += 30) {
                const rad = (angle - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(rad) * (RADIUS_MILES * pxPerMile);
                const y1 = centerY + Math.sin(rad) * (RADIUS_MILES * pxPerMile);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('N', centerX, centerY - (RADIUS_MILES * pxPerMile) - 20);
            ctx.fillText('S', centerX, centerY + (RADIUS_MILES * pxPerMile) + 20);
            ctx.fillText('E', centerX + (RADIUS_MILES * pxPerMile) + 20, centerY);
            ctx.fillText('W', centerX - (RADIUS_MILES * pxPerMile) - 20, centerY);

            drawRadarSweep(centerX, centerY, pxPerMile);
            drawAircraft(centerX, centerY, pxPerMile);
            drawAirports(centerX, centerY, pxPerMile);
        }

        function drawAircraft(centerX, centerY, pxPerMile) {
            aircraft.forEach((ac, idx) => {
                const acPoint = map.latLngToContainerPoint([ac.latitude, ac.longitude]);
                const x = acPoint.x;
                const y = acPoint.y;

                // Only draw if within canvas bounds (with some margin)
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) {
                    return;
                }

                // Check if this is the tracked aircraft
                const isTracked = ac.registration === TRACKED_AIRCRAFT;

                // Determine color: red for tracked, yellow for hovered, cyan for normal
                if (isTracked) {
                    ctx.fillStyle = '#ff0000'; // Red for tracked aircraft
                } else if (hoveredAircraft === idx) {
                    ctx.fillStyle = '#ffff00'; // Yellow for hovered
                } else {
                    ctx.fillStyle = '#00ffff'; // Cyan for normal
                }

                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ac.callsign.substring(0, 3), x, y);
            });
        }

        function drawAirports(centerX, centerY, pxPerMile) {

        // Vercel backend proxy
        async function proxyFetch(apiUrl) {
            const proxyUrl = BACKEND_URL + encodeURIComponent(apiUrl);
            console.log('Fetching via Vercel backend:', apiUrl);

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response;
            } catch (e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        // Check if a SIGMET is near home
        function sigmetNearHome(coords) {
            const MAX_SIGMET_POINTS = 64;
            const SIGMET_RANGE_MILES = 25;
            const NM_RANGE = SIGMET_RANGE_MILES / NM_TO_MILES;

            let xs = [], ys = [];
            let n = 0;
            const cosLat = Math.cos(USER_LAT * Math.PI / 180);

            for (let c of coords) {
                if (n >= MAX_SIGMET_POINTS) break;
                if (!c.lat || !c.lon) continue;
                xs[n] = (c.lon - USER_LON) * 60 * cosLat;  // nautical miles east
                ys[n] = (c.lat - USER_LAT) * 60;            // nautical miles north
                n++;
            }
            if (n < 3) return false;

            let inside = false;
            let minDist = 1e9;

            for (let i = 0, j = n - 1; i < n; j = i++) {
                let xi = xs[i], yi = ys[i], xj = xs[j], yj = ys[j];
                if (((yi > 0) !== (yj > 0)) && (0 < (xj - xi) * (0 - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
                let dx = xj - xi, dy = yj - yi;
                let len2 = dx * dx + dy * dy;
                let t = len2 > 0 ? Math.max(0, Math.min(1, -(xi * dx + yi * dy) / len2)) : 0;
                let cx = xi + t * dx, cy = yi + t * dy;
                let d = Math.sqrt(cx * cx + cy * cy);
                if (d < minDist) minDist = d;
            }
            return inside || minDist <= NM_RANGE;
        }

        // Fetch SIGMETs from aviationweather.gov
        async function fetchSigmets() {
            try {
                const url = 'https://aviationweather.gov/api/data/airsigmet?format=json';
                const response = await proxyFetch(url);
                if (!response.ok) throw new Error('SIGMET fetch failed');

                const data = await response.json();
                let sigmetText = '';
                let found = 0;

                for (let s of data) {
                    if (s.airSigmetType !== 'SIGMET') continue;
                    if (!sigmetNearHome(s.coords)) continue;

                    let hazard = s.hazard || '';
                    let hazardName = hazard;
                    if (hazard === 'CONVECTIVE') hazardName = 'Thunderstorms';
                    else if (hazard === 'TURB') hazardName = 'Turbulence';
                    else if (hazard === 'ICE') hazardName = 'Icing';
                    else if (hazard === 'IFR') hazardName = 'IFR';
                    else if (hazard === 'MTN OBSCN') hazardName = 'Mtn obscuration';
                    else if (hazard === 'ASH') hazardName = 'Volcanic ash';
                    else if (hazard === 'TROPICAL CYCLONE' || hazard === 'TC') hazardName = 'Tropical cyclone';

                    let altText = '';
                    if (s.altitudeHi1 > 0) {
                        let lowAlt = s.altitudeLow1 >= 18000 ? 'FL' + Math.round(s.altitudeLow1/100) : s.altitudeLow1 + ' ft';
                        let highAlt = s.altitudeHi1 >= 18000 ? 'FL' + Math.round(s.altitudeHi1/100) : s.altitudeHi1 + ' ft';
                        altText = ' ' + lowAlt + '-' + highAlt;
                    }

                    let until = '';
                    if (s.validTimeTo) {
                        let dt = new Date(s.validTimeTo);
                        until = ' until ' + String(dt.getUTCHours()).padStart(2, '0') + String(dt.getUTCMinutes()).padStart(2, '0') + 'Z';
                    }

                    if (found > 0) sigmetText += '     |     ';
                    sigmetText += 'SIGMET ' + (s.seriesId || '') + ': ' + hazardName + altText + until;
                    found++;
                }

                // Find the text area inside the left SIGMET box
                const sigmetDiv = document.getElementById('sigmetDisplay');

                // "found" counts the SIGMETs that touch the 25-mile area around home (checked in the loop above).
                // The right-hand "AWC Map FL" box is a plain link in the HTML, so it needs no code and is always active.
                if (found === 0) {
                    // Nothing active: short grey text. Normal weight undoes the bold from an earlier alert.
                    sigmetDiv.textContent = 'No SIGMETs';
                    sigmetDiv.style.color = '#666';
                    sigmetDiv.style.fontWeight = 'normal';
                } else {
                    // At least one active: short red bold alert. The details are on the AWC map, so we don't list them here.
                    sigmetDiv.textContent = 'SIGMETS Active';
                    sigmetDiv.style.color = '#d32f2f';
                    sigmetDiv.style.fontWeight = 'bold';
                }
            } catch (e) {
                console.log('SIGMET fetch error:', e.message);
                document.getElementById('sigmetDisplay').textContent = 'SIGMETs unavailable';
            }
        }

        // Use OpenSky Network API
        async function fetchAircraft() {
            try {
                console.log('Fetching aircraft from adsb.lol...');
                const radiusNm = RADIUS_MILES / NM_TO_MILES;
                const url = `https://api.adsb.lol/v2/point/${USER_LAT}/${USER_LON}/${radiusNm}`;

                const response = await proxyFetch(url);
                const data = await response.json();

                console.log('Aircraft received:', data.ac?.length || 0);

                if (!data.ac || data.ac.length === 0) {
                    aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft detected</p>';
                    aircraft = [];
                    drawRadar();
                    statusDiv.textContent = 'Radar: Live (none)';
                    statusDiv.style.background = 'rgba(100,150,0,0.7)';
                    return;
                }

                aircraft = data.ac.map(a => {
                    const distMiles = (a.dst || 0) * NM_TO_MILES;

                    return {
                        callsign: (a.flight || a.r || a.hex || 'Unknown').trim().toUpperCase(),
                        icao: a.hex || 'N/A',
                        registration: a.r || 'N/A',
                        latitude: a.lat || 0,
                        longitude: a.lon || 0,
                        altitude: a.alt_baro !== undefined ? a.alt_baro : a.alt_geom,
                        altitudeText: a.alt_baro === 'ground' ? 'GND' : (a.alt_baro || a.alt_geom || '?'),
                        velocity: a.gs ? Math.round(a.gs) : -1,
                        track: a.track ? Math.round(a.track) : -1,
                        verticalRate: a.baro_rate || a.geom_rate || 0,
                        distance: distMiles,
                        bearing: a.dir !== undefined ? Math.round(a.dir) : -1,
                        squawk: a.squawk || '-',
                        category: a.category || '-',
                        type: a.t || '-'
                    };
                }).filter(ac => ac.latitude && ac.longitude);

                // Drop aircraft that have been sitting on the ground for more than a minute
                const nowMs = Date.now();
                const seenNow = {};
                aircraft = aircraft.filter(ac => {
                    if (ac.altitude !== 'ground') {
                        return true;                                   // airborne: keep, and forget any ground timer
                    }
                    seenNow[ac.icao] = true;
                    if (!groundSince[ac.icao]) groundSince[ac.icao] = nowMs;   // first time we saw it on the ground
                    if (ac.registration === TRACKED_AIRCRAFT) return true;     // never hide the watched aircraft
                    return nowMs - groundSince[ac.icao] < GROUND_HIDE_MS;
                });
                Object.keys(groundSince).forEach(hex => { if (!seenNow[hex]) delete groundSince[hex]; });

                // Sort by distance
                aircraft.sort((a, b) => a.distance - b.distance);

                // Check for tracked aircraft and send notification
                const trackedFound = aircraft.find(ac => ac.registration === TRACKED_AIRCRAFT);
                if (trackedFound && !notifiedAircraft[TRACKED_AIRCRAFT]) {
                    sendNtfyNotification(`${TRACKED_AIRCRAFT} is in the air`);
                    notifiedAircraft[TRACKED_AIRCRAFT] = true;
                }
                // Clear notification flag if tracked aircraft is no longer detected
                if (!trackedFound) {
                    notifiedAircraft[TRACKED_AIRCRAFT] = false;
                }

                console.log('Filtered aircraft:', aircraft.length);
                updateAircraftList();
                drawRadar();
                statusDiv.textContent = `Radar: Live (${aircraft.length})`;
                statusDiv.style.background = 'rgba(0,150,0,0.7)';
            } catch (e) {
                console.error('Aircraft error:', e);
                statusDiv.textContent = 'Aircraft: Error';
                statusDiv.style.background = 'rgba(150,0,0,0.7)';
                aircraftListDiv.innerHTML = '<p class="error-text">Error loading aircraft data</p>';
            }
        }

        // ---------- Clock: local time, then UTC in parentheses ----------
        function updateClock() {
            const d = new Date();
            const p2 = n => String(n).padStart(2, '0');
            document.getElementById('clock').textContent =
                `${p2(d.getHours())}:${p2(d.getMinutes())} (${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}Z)`;

        // ---------- Generate SVG wind barb based on speed in knots ----------
        // Wind barbs show direction (staff) and speed (barbs/feathers)
        // 50 kt = triangle, 10 kt = long line, 5 kt = short line (combinations add up)
        function generateWindBarbSvg(windSpeedKts) {
            // Build the barb pattern from wind speed
            let barbs = [];
            let remaining = windSpeedKts;

            // 50-knot triangles (pennants)
            while (remaining >= 50) {
                barbs.push('triangle');
                remaining -= 50;
            }
            // 10-knot long barbs
            while (remaining >= 10) {
                barbs.push('long');
                remaining -= 10;
            }
            // 5-knot short barbs
            while (remaining >= 5) {
                barbs.push('short');
                remaining -= 5;
            }

            // Build SVG: staff is the main vertical line, barbs branch off at angle
            let burbMarkup = '<g fill="none" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
            burbMarkup += '<line x1="20" y1="32" x2="20" y2="8"/>';  // main staff

            // Draw barbs on the right side of staff (at 45-degree angle, angled back)
            barbs.forEach((barb, idx) => {
                const yPos = 32 - (idx * 3.5); // space them down the staff
                if (barb === 'triangle') {
                    // 50kt triangle (filled)
                    burbMarkup += `<polygon points="20,${yPos} 26,${yPos-4} 26,${yPos+4}" fill="#0066cc"/>`;
                } else if (barb === 'long') {
                    // 10kt long barb (30 degrees angle)
                    burbMarkup += `<line x1="20" y1="${yPos}" x2="26" y2="${yPos-4}"/>`;
                } else if (barb === 'short') {
                    // 5kt short barb (30 degrees angle, shorter)
                    burbMarkup += `<line x1="20" y1="${yPos}" x2="23" y2="${yPos-2}"/>`;
                }
            });

            burbMarkup += '</g>';
            return burbMarkup;
        }

        // ---------- KSUA weather: wind, temperature, dew point ----------
        async function fetchWeather() {
            try {
                const url = `https://aviationweather.gov/api/data/metar?format=json&ids=${WIND_STATION}`;
                const response = await proxyFetch(url);
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) return;
                const m = data[0];
                ksuaMetarData = m;

                // Wind: speed on top, direction below
                const kts = m.wspd;
                const gust = m.wgst;
                const variable = (typeof m.wdir === 'string');          // "VRB"
                const dir = (typeof m.wdir === 'number') ? m.wdir % 360 : null;
                let speedText = 'Wind --', dirText = 'Dir --', showArrow = false;
                if (kts === 0) {
                    speedText = 'Wind calm';
                } else if (typeof kts === 'number') {
                    speedText = 'Wind ' + kts + (gust > kts ? 'G' + gust : '') + ' kt';
                    if (variable) {
                        dirText = 'Dir VRB';
                    } else if (dir !== null) {
                        dirText = 'Dir ' + String(dir).padStart(3, '0') + '°';
                        showArrow = true;
                    }
                }
                document.getElementById('wxSpeed').textContent = speedText;
                document.getElementById('wxDir').textContent = dirText;

                // Wind barb on the map (shows direction + speed with feathers)
                const arrowBox = document.getElementById('windArrow');
                if (showArrow && typeof kts === 'number') {
                    const toward = WIND_ARROW_POINTS_DOWNWIND ? (dir + 180) % 360 : dir;
                    // Replace arrow SVG with wind barb (barbs indicate speed)
                    document.getElementById('windArrowSvg').innerHTML = generateWindBarbSvg(kts);
                    document.getElementById('windArrowSvg').style.transform = `rotate(${toward}deg)`;
                    arrowBox.style.display = 'block';
                } else {
                    arrowBox.style.display = 'none';
                }

                // Temperature and dew point (the METAR gives degrees C)
                const toF = c => Math.round(c * 9 / 5 + 32);
                document.getElementById('wxTemp').textContent = typeof m.temp === 'number' ? 'Temp ' + toF(m.temp) + '°F' : 'Temp --';
                document.getElementById('wxDew').textContent = typeof m.dewp === 'number' ? 'Dew pt ' + toF(m.dewp) + '°F' : 'Dew pt --';
            } catch (e) {
                console.log('Weather fetch error:', e.message);   // keep showing the last values
            }
        }

        function updateAircraftList() {
            const sorted = aircraft.slice(0, 12);

            if (sorted.length === 0) {
                aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft nearby</p>';
            } else {
                aircraftListDiv.innerHTML = sorted.map((ac, idx) => {
                    const isTracked = ac.registration === TRACKED_AIRCRAFT;
                    const trackedClass = isTracked ? 'tracked' : '';
                    return `
                    <div class="aircraft-item ${trackedClass}"
                         onmouseover="hoveredAircraft = ${idx}; drawRadar();"
                         onmouseout="hoveredAircraft = null; drawRadar();"
                         onclick="showAircraftDetail(${idx});">
                        <strong>${ac.callsign} ${ac.type || 'N/A'}</strong>
                        <div class="detail">${ac.distance.toFixed(1)} mi • ${ac.altitudeText} ft</div>
                        <div class="detail" style="font-size: 11px; color: #0066cc;">
                            ${ac.velocity >= 0 ? ac.velocity + ' kt' : 'N/A'} •
                            ${ac.track >= 0 ? ac.track + '°' : 'N/A'} •
                            ${ac.verticalRate ? (ac.verticalRate > 0 ? '↑' : '↓') + Math.abs(Math.round(ac.verticalRate)) : '—'} ft/m
                        </div>
                    </div>
                `;
                }).join('');
            }
        }

        function updateAirportList() {
            const sorted = AIRPORTS.map(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                return { ...ap, dist };
            }).sort((a, b) => a.dist - b.dist);

            let html = '';
            sorted.forEach(ap => {
                html += `
                    <div class="airport-item" onclick="showAirportDetail('${ap.code}')">
                        <strong>${ap.code}</strong> ${ap.name}
                        <div class="distance">${ap.dist.toFixed(1)} mi</div>
                    </div>
                `;
                // Add KSUA buttons after SUA airport
                if (ap.code === 'SUA') {
                    html += `<div class="ksua-live-atc-link" onclick="openLiveATC()">Stuart Ground/Control Tower Radio</div>`;
                    html += `<div class="ksua-live-atc-link" onclick="openPBIDeparture()">Palm Beach Departure Radio</div>`;
                    html += `<div class="ksua-weather-link" onclick="openKSUAWeather()">KSUA Weather METAR/TAF</div>`;
                }
                // Add Vero Tower button after VRB airport
                if (ap.code === 'VRB') {
                    html += `<div class="ksua-live-atc-link" onclick="openVeroTower()">Vero Control Tower Radio</div>`;
                }
                // Add KFPR Tower button after KFPR airport
                if (ap.code === 'KFPR') {
                    html += `<div class="ksua-live-atc-link" onclick="openKFPRTower()">KFPR Control Tower radio</div>`;
                }
                // Add PBI buttons after PBI airport
                if (ap.code === 'PBI') {
                    html += `<div class="ksua-live-atc-link" onclick="openPBITower()">PBI Control Tower Radio</div>`;
                }
                // Add separator after airport group
                html += `<div class="airport-separator"></div>`;
            });
            document.getElementById('airportList').innerHTML = html;
        }

        function showAircraftDetail(idx) {
            const ac = aircraft[idx];
            const bearing = ac.bearing >= 0 ? ac.bearing : 0;
            const bearingText = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round((bearing + 360) % 360 / 22.5) % 16];

            document.getElementById('detailCallsign').textContent = ac.callsign || 'Unknown';
            const rows = `
                <tr><td>Registration</td><td>${ac.registration}</td></tr>
                <tr><td>ICAO (Hex)</td><td style="font-family: monospace;">${ac.icao}</td></tr>
                <tr><td>Latitude</td><td>${ac.latitude.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ac.longitude.toFixed(4)}°</td></tr>
                <tr><td>Altitude</td><td>${ac.altitudeText} ft</td></tr>
                <tr><td>Velocity</td><td>${ac.velocity >= 0 ? ac.velocity + ' kt' : 'N/A'}</td></tr>
                <tr><td>Track</td><td>${ac.track >= 0 ? ac.track + '°' : 'N/A'}</td></tr>
                <tr><td>Vertical Rate</td><td>${ac.verticalRate ? Math.round(ac.verticalRate) + ' ft/m' : 'N/A'}</td></tr>
                <tr><td>Distance</td><td>${ac.distance.toFixed(1)} miles</td></tr>
                <tr><td>Bearing</td><td>${ac.bearing >= 0 ? ac.bearing + '° (' + bearingText + ')' : 'N/A'}</td></tr>
                <tr><td>Squawk</td><td>${ac.squawk}</td></tr>
                <tr><td>Type</td><td>${ac.type}</td></tr>
            `;
            document.getElementById('detailTable').innerHTML = rows;
            detailModal.classList.add('active');
        }

        // Map of airport codes to their diagram/photo file extensions
        const airportDiagrams = {
            'BCT': 'pdf',
            'OBK': 'jpg',
            'PBI': 'pdf',
            'SUA': 'pdf',
            'VRB': 'pdf',
            'KFPR': 'pdf'
        };

        // The saved diagram file for KFPR is still named X21.pdf
        const diagramFileNames = { 'KFPR': 'X21' };

        function showAirportDetail(code) {
            const ap = AIRPORTS.find(a => a.code === code);
            if (!ap) return;

            // Directly open the diagram if available
            if (airportDiagrams[code]) {
                const ext = airportDiagrams[code];
                const diagramUrl = `https://cdn.jsdelivr.net/gh/drewflhr-cmyk/local_aviation@main/public/images/airports/${diagramFileNames[code] || code}.${ext}`;
                window.open(diagramUrl, '_blank');
            }
        }

        function openLiveATC() {
            // Open LiveATC link in a new tab
            window.open('https://www.liveatc.net/search/?icao=ksua', '_blank');
        }

        function openPBITower() {
            // Open PBI Tower LiveATC link in a new tab
            window.open('https://www.liveatc.net/hlisten.php?mount=kpbi2_twr&icao=kdjt', '_blank');
        }

        function openVeroTower() {
            // Open Vero Beach Tower LiveATC link in a new tab
            window.open('https://www.liveatc.net/hlisten.php?mount=kvrb_twr&icao=kvrb', '_blank');
        }

        function openKFPRTower() {
            // Open Fort Pierce Ground/Tower LiveATC link in a new tab
            window.open('https://www.liveatc.net/hlisten.php?mount=kfpr3_gnd_twr&icao=kfpr', '_blank');
        }

        function openPBIDeparture() {
            // Open PBI Departure LiveATC link in a new tab
            window.open('https://www.liveatc.net/hlisten.php?mount=kpbi2_dep_n&icao=kdjt', '_blank');
        }

        function openKSUAWeather() {
            // Try to open in a popup window, fall back to opening in new tab if popup is blocked
            const popup = window.open(ksuaWeatherUrl, 'KSUA_Weather', 'width=1000,height=800');
            if (!popup) {
                window.open(ksuaWeatherUrl, '_blank');
            }
        }

        canvas.addEventListener('click', (e) => {
            const containerRect = container.getBoundingClientRect();
            const clickX = e.clientX - containerRect.left;
            const clickY = e.clientY - containerRect.top;

            // Check aircraft
            for (let i = 0; i < aircraft.length; i++) {
                const ac = aircraft[i];
                const acPoint = map.latLngToContainerPoint([ac.latitude, ac.longitude]);

                if (Math.hypot(clickX - acPoint.x, clickY - acPoint.y) < 12) {
                    showAircraftDetail(i);
                    return;
                }
            }

            // Check airports
            for (let i = 0; i < AIRPORTS.length; i++) {
                const ap = AIRPORTS[i];
                const apPoint = map.latLngToContainerPoint([ap.lat, ap.lon]);

                if (Math.hypot(clickX - apPoint.x, clickY - apPoint.y) < 12) {
                    showAirportDetail(ap.code);
                    return;
                }
            }
        });

        window.addEventListener('resize', resizeCanvas);

        initMap();
        resizeCanvas();
        updateAirportList();
        fetchAircraft();
        fetchSigmets();
        fetchWeather();
        updateClock();

        // Animate radar sweep continuously
        function animateRadar() {
            drawRadar();
            requestAnimationFrame(animateRadar);
        }
        animateRadar();

        // Refresh aircraft every 10 seconds, SIGMETs every 5 minutes, weather every 10 minutes
        setInterval(fetchAircraft, 10000);
        setInterval(fetchSigmets, 5 * 60 * 1000);
        setInterval(fetchWeather, 10 * 60 * 1000);
        setInterval(updateClock, 1000);

        console.log('Radar ready - using adsb.lol API');
    </script>
</body>
</html>
