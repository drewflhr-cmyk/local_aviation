<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Aviation Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 1rem;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .location-input {
            margin-bottom: 1.5rem;
            font-size: 12px;
            color: #666;
        }

        .location-input input {
            padding: 6px 8px;
            font-size: 12px;
            margin: 0 4px;
            width: 140px;
        }

        .location-input button {
            padding: 6px 12px;
            font-size: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .location-input button:hover {
            background: #0052a3;
        }

        .radar-section {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .radar-container {
            position: relative;
            aspect-ratio: 1;
            background: #000;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 100;
        }

        .radar-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 500;
            z-index: 101;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #aircraftList, #airportList {
            font-size: 12px;
            max-height: 240px;
            overflow-y: auto;
        }

        .aircraft-item, .airport-item {
            padding: 8px 0;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background 0.2s;
        }

        .aircraft-item:hover, .airport-item:hover {
            background: #f0f0f0;
        }

        .aircraft-item strong, .airport-item strong {
            display: block;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .aircraft-item .detail {
            font-size: 11px;
            color: #888;
        }

        .airport-item {
            color: #1a1a1a;
        }

        .airport-item .distance {
            font-size: 11px;
            color: #888;
        }

        .metar-panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
        }

        #metar {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 0.75rem;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #1a1a1a;
            max-height: 120px;
            overflow-y: auto;
            min-height: 40px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin: 0 0 1.5rem 0;
            font-size: 18px;
            color: #1a1a1a;
        }

        .modal-content table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .modal-content td {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-content td:first-child {
            color: #888;
            width: 50%;
        }

        .modal-content td:last-child {
            text-align: right;
            color: #1a1a1a;
            font-weight: 500;
        }

        #diagramContainer {
            width: 100%;
            height: 400px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin: 1rem 0;
            background: #f9f9f9;
        }

        .diagram-loading {
            padding: 20px;
            text-align: center;
            color: #666;
        }

        .modal-close {
            width: 100%;
            margin-top: 1.5rem;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .error-text {
            color: #d32f2f;
            font-size: 11px;
        }

        .info-text {
            color: #0066cc;
            font-size: 11px;
            margin-top: 0.5rem;
        }

        @media (max-width: 900px) {
            .radar-section {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 1rem;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 1rem;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Aviation Radar</h1>

        <div class="location-input">
            <label>Your Location (Lat/Lon):</label>
            <input type="text" id="latInput" placeholder="27.248805" value="27.248805">
            <input type="text" id="lonInput" placeholder="-80.259035" value="-80.259035">
            <button onclick="updateLocation()">Update</button>
            <button onclick="getGeolocation()">Auto-detect</button>
            <span class="info-text" id="locationStatus"></span>
        </div>

        <div class="radar-section">
            <div class="radar-container">
                <div id="mapContainer"></div>
                <canvas id="radarCanvas"></canvas>
                <div class="radar-status" id="radarStatus">Loading…</div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Aircraft Nearby</div>
                    <div id="aircraftList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">Airports</div>
                    <div id="airportList">
                        <p style="color: #999; margin: 0;">Loading…</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="metar-panel">
            <div class="panel-title">METAR - SUA (Stuart)</div>
            <div id="metar">Loading…</div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <h3 id="detailCallsign"></h3>
            <table id="detailTable"></table>
            <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <div class="modal" id="airportModal">
        <div class="modal-content">
            <h3 id="airportName"></h3>
            <table id="airportTable"></table>
            <div id="diagramContainer" class="diagram-loading">
                <p id="diagramStatus">Loading airport diagram...</p>
            </div>
            <p style="margin-top: 1rem; font-size: 12px; color: #666;">
                External links:
                <a id="skyvectorLink" href="#" target="_blank" style="color: #0066cc;">SkyVector</a> |
                <a id="googlemapsLink" href="#" target="_blank" style="color: #0066cc;">Google Maps</a> |
                <a id="aopaLink" href="#" target="_blank" style="color: #0066cc;">AOPA Diagram</a>
            </p>
            <button class="modal-close" onclick="document.getElementById('airportModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const aircraftListDiv = document.getElementById('aircraftList');
        const metarDiv = document.getElementById('metar');
        const detailModal = document.getElementById('detailModal');
        const airportModal = document.getElementById('airportModal');
        const statusDiv = document.getElementById('radarStatus');
        const locationStatus = document.getElementById('locationStatus');

        let USER_LAT = 27.248805;
        let USER_LON = -80.259035;
        const RADIUS_MILES = 50;

        const AIRPORTS = [
            { code: 'SUA', name: 'Stuart', lat: 27.1907, lon: -80.2556, runways: '09/27', state: 'FL', region: 'SE-3' },
            { code: 'X21', name: 'Treasure Coast Intl', lat: 27.2317, lon: -80.4039, runways: '09/27, 18/36', state: 'FL', region: 'SE-3' },
            { code: 'OBK', name: 'Okeechobee', lat: 27.0942, lon: -80.8364, runways: '09/27', state: 'FL', region: 'SE-3' },
            { code: 'VRB', name: 'Vero Beach Intl', lat: 27.6553, lon: -80.3519, runways: '09/27, 16/34', state: 'FL', region: 'SE-3' },
            { code: 'PBI', name: 'Palm Beach Intl (DJT)', lat: 26.6826, lon: -80.0952, runways: '09L/27R, 09R/27L', state: 'FL', region: 'SE-3' },
            { code: 'BCT', name: 'Boca Raton', lat: 26.3787, lon: -80.2258, runways: '09/27', state: 'FL', region: 'SE-3' },
        ];

        let aircraft = [];
        let hoveredAircraft = null;
        let map = null;
        let airportMarkers = [];
        let userMarker = null;
        let radiusCircle = null;

        function getGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('latInput').value = pos.coords.latitude.toFixed(4);
                    document.getElementById('lonInput').value = pos.coords.longitude.toFixed(4);
                    updateLocation();
                    locationStatus.textContent = '✓ Location detected';
                });
            } else {
                locationStatus.textContent = 'Geolocation not available';
            }
        }

        function updateLocation() {
            const lat = parseFloat(document.getElementById('latInput').value);
            const lon = parseFloat(document.getElementById('lonInput').value);

            if (isNaN(lat) || isNaN(lon)) {
                locationStatus.textContent = '✗ Invalid coordinates';
                return;
            }

            USER_LAT = lat;
            USER_LON = lon;
            locationStatus.textContent = `✓ Location: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

            if (map) {
                map.setView([USER_LAT, USER_LON], 9);
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker([USER_LAT, USER_LON], {
                    radius: 6, color: '#0066cc', fill: true, fillColor: '#0066cc', weight: 2
                }).addTo(map);

                if (radiusCircle) map.removeLayer(radiusCircle);
                radiusCircle = L.circle([USER_LAT, USER_LON], {
                    radius: RADIUS_MILES * 1609.34, color: '#0066cc', fill: false, weight: 2, opacity: 0.5
                }).addTo(map);
            }

            updateAirportMarkers();
            updateAirportList();
            drawRadar();
            fetchAircraft();
            fetchMETAR();
        }

        function initMap() {
            map = L.map('mapContainer').setView([USER_LAT, USER_LON], 9);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri, DigitalGlobe, Earthstar Geographics, CNES/Airbus DS',
                maxZoom: 18
            }).addTo(map);

            radiusCircle = L.circle([USER_LAT, USER_LON], {
                radius: RADIUS_MILES * 1609.34, color: '#0066cc', fill: false, weight: 2, opacity: 0.5
            }).addTo(map);

            userMarker = L.circleMarker([USER_LAT, USER_LON], {
                radius: 6, color: '#0066cc', fill: true, fillColor: '#0066cc', weight: 2
            }).addTo(map);

            updateAirportMarkers();
        }

        function updateAirportMarkers() {
            // Remove old markers
            airportMarkers.forEach(m => map.removeLayer(m));
            airportMarkers = [];

            // Add new markers
            AIRPORTS.forEach(ap => {
                const marker = L.marker([ap.lat, ap.lon], {
                    title: ap.code
                }).addTo(map);

                marker.bindPopup(`<strong>${ap.code}</strong><br>${ap.name}<br><a onclick="showAirportDetail('${ap.code}')">View Details</a>`);
                marker.on('click', () => showAirportDetail(ap.code));
                airportMarkers.push(marker);
            });
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvas.width = size;
            canvas.height = size;
            drawRadar();
        }

        function drawRadar() {
            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const pxPerMile = size / (RADIUS_MILES * 2);

            ctx.clearRect(0, 0, size, size);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;

            for (let i = 1; i <= 5; i++) {
                const radius = (i * 10) * pxPerMile;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 0.5;

            for (let angle = 0; angle < 360; angle += 30) {
                const rad = (angle - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(rad) * (RADIUS_MILES * pxPerMile);
                const y1 = centerY + Math.sin(rad) * (RADIUS_MILES * pxPerMile);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('N', centerX, centerY - (RADIUS_MILES * pxPerMile) - 20);
            ctx.fillText('S', centerX, centerY + (RADIUS_MILES * pxPerMile) + 20);
            ctx.fillText('E', centerX + (RADIUS_MILES * pxPerMile) + 20, centerY);
            ctx.fillText('W', centerX - (RADIUS_MILES * pxPerMile) - 20, centerY);

            drawAircraft(centerX, centerY, pxPerMile);
            drawAirports(centerX, centerY, pxPerMile);
        }

        function drawAircraft(centerX, centerY, pxPerMile) {
            aircraft.forEach((ac, idx) => {
                const dlat = ac.latitude - USER_LAT;
                const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const distMiles = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * distMiles * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * distMiles * pxPerMile;

                ctx.fillStyle = hoveredAircraft === idx ? '#ffff00' : '#00ffff';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ac.callsign.substring(0, 3), x, y);
            });
        }

        function drawAirports(centerX, centerY, pxPerMile) {
            AIRPORTS.forEach(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * (Math.sqrt(dlat*dlat + dlon*dlon) * 69) * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * (Math.sqrt(dlat*dlat + dlon*dlon) * 69) * pxPerMile;

                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.rect(x - 6, y - 6, 12, 12);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ap.code, x, y);
            });
        }

        async function fetchAircraft() {
            try {
                console.log(`Fetching aircraft around ${USER_LAT}, ${USER_LON}...`);
                const response = await fetch(`https://opensky-network.org/api/states/all?lamin=${USER_LAT - 0.8}&lamax=${USER_LAT + 0.8}&lomin=${USER_LON - 0.8}&lomax=${USER_LON + 0.8}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('Aircraft data received:', data.states?.length || 0, 'aircraft');

                if (!data.states || data.states.length === 0) {
                    aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft detected</p>';
                    aircraft = [];
                    drawRadar();
                    return;
                }

                aircraft = data.states.map(s => ({
                    callsign: s[1]?.trim() || 'Unknown',
                    icao: s[0],
                    latitude: s[6],
                    longitude: s[5],
                    altitude: s[7],
                    velocity: s[9],
                    track: s[10],
                    verticalRate: s[11],
                    geoAltitude: s[13],
                    lastContact: s[4]
                })).filter(ac => ac.latitude && ac.longitude);

                console.log('Filtered aircraft:', aircraft.length);
                updateAircraftList();
                drawRadar();
                statusDiv.textContent = 'Radar: Live';
                statusDiv.style.background = 'rgba(0,150,0,0.7)';
            } catch (e) {
                console.error('Error fetching aircraft:', e);
                statusDiv.textContent = 'Radar: Error';
                statusDiv.style.background = 'rgba(150,0,0,0.7)';
                aircraftListDiv.innerHTML = '<p class="error-text">Error loading aircraft data</p>';
            }
        }

        function updateAircraftList() {
            const sorted = aircraft
                .map((ac, idx) => {
                    const dlat = ac.latitude - USER_LAT;
                    const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                    const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                    return { ...ac, dist, idx };
                })
                .sort((a, b) => a.dist - b.dist)
                .slice(0, 12);

            if (sorted.length === 0) {
                aircraftListDiv.innerHTML = '<p style="color: #999; margin: 0;">No aircraft detected</p>';
            } else {
                aircraftListDiv.innerHTML = sorted.map(ac => `
                    <div class="aircraft-item"
                         onmouseover="hoveredAircraft = ${ac.idx}; drawRadar();"
                         onmouseout="hoveredAircraft = null; drawRadar();"
                         onclick="showAircraftDetail(${ac.idx});">
                        <strong>${ac.callsign}</strong>
                        <div class="detail">${ac.dist.toFixed(1)} mi • ${ac.altitude ? Math.round(ac.altitude * 3.28084) + ' ft' : '?'}</div>
                    </div>
                `).join('');
            }
        }

        function updateAirportList() {
            const sorted = AIRPORTS.map(ap => {
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                return { ...ap, dist };
            }).sort((a, b) => a.dist - b.dist);

            document.getElementById('airportList').innerHTML = sorted.map(ap => `
                <div class="airport-item" onclick="showAirportDetail('${ap.code}')">
                    <strong>${ap.code}</strong> ${ap.name}
                    <div class="distance">${ap.dist.toFixed(1)} miles</div>
                </div>
            `).join('');
        }

        function showAircraftDetail(idx) {
            const ac = aircraft[idx];
            const dlat = ac.latitude - USER_LAT;
            const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
            const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
            const bearing = Math.atan2(dlon * 69, dlat * 69) * 180 / Math.PI;
            const bearingText = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round((bearing + 360) % 360 / 22.5) % 16];

            document.getElementById('detailCallsign').textContent = ac.callsign;
            const rows = `
                <tr><td>ICAO</td><td style="font-family: monospace;">${ac.icao || 'N/A'}</td></tr>
                <tr><td>Latitude</td><td>${ac.latitude.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ac.longitude.toFixed(4)}°</td></tr>
                <tr><td>Altitude</td><td>${ac.altitude ? Math.round(ac.altitude * 3.28084).toLocaleString() + ' ft' : 'N/A'}</td></tr>
                <tr><td>Velocity</td><td>${ac.velocity ? Math.round(ac.velocity * 1.94384).toLocaleString() + ' kt' : 'N/A'}</td></tr>
                <tr><td>Track</td><td>${ac.track ? Math.round(ac.track).toLocaleString() + '°' : 'N/A'}</td></tr>
                <tr><td>Vertical Rate</td><td>${ac.verticalRate ? Math.round(ac.verticalRate * 196.85).toLocaleString() + ' ft/m' : 'N/A'}</td></tr>
                <tr><td>Distance</td><td>${dist.toFixed(1)} miles</td></tr>
                <tr><td>Bearing</td><td>${Math.round((bearing + 360) % 360)}° (${bearingText})</td></tr>
            `;
            document.getElementById('detailTable').innerHTML = rows;
            detailModal.classList.add('active');
        }

        function showAirportDetail(code) {
            const ap = AIRPORTS.find(a => a.code === code);
            if (!ap) return;

            const dlat = ap.lat - USER_LAT;
            const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
            const dist = Math.sqrt(dlat*dlat + dlon*dlon) * 69;

            document.getElementById('airportName').textContent = `${ap.code} - ${ap.name}`;
            const rows = `
                <tr><td>Latitude</td><td>${ap.lat.toFixed(4)}°</td></tr>
                <tr><td>Longitude</td><td>${ap.lon.toFixed(4)}°</td></tr>
                <tr><td>Distance</td><td>${dist.toFixed(1)} miles</td></tr>
                <tr><td>Runways</td><td>${ap.runways}</td></tr>
            `;
            document.getElementById('airportTable').innerHTML = rows;

            // Load airport diagram
            loadAirportDiagram(ap);

            // External links
            document.getElementById('skyvectorLink').href = `https://skyvector.com/?ll=${ap.lat},${ap.lon}&chart=301&zoom=2`;
            document.getElementById('googlemapsLink').href = `https://maps.google.com/?q=${ap.lat},${ap.lon}`;
            document.getElementById('aopaLink').href = `https://www.aopa.org/ustprocs/current/${ap.state.toLowerCase()}/`;

            airportModal.classList.add('active');
        }

        function loadAirportDiagram(ap) {
            const diagramContainer = document.getElementById('diagramContainer');
            const diagramStatus = document.getElementById('diagramStatus');

            diagramStatus.textContent = 'Loading airport diagram...';

            // Try multiple chart cycle dates (AOPA updates every 28 days)
            const today = new Date();
            const dates = [];
            for (let i = 0; i < 3; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i * 7);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                dates.push(`${yyyy}${mm}${dd}`);
            }

            // Try to find working diagram URL
            let found = false;
            for (const dateStr of dates) {
                const url = `https://www.aopa.org/ustprocs/${dateStr}/${ap.region}/${ap.code.toLowerCase()}_airport_diagram.pdf`;

                // Try to load
                fetch(url, { method: 'HEAD' })
                    .then(r => {
                        if (r.ok) {
                            diagramContainer.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>`;
                            found = true;
                        }
                    })
                    .catch(() => {
                        if (!found && dateStr === dates[dates.length - 1]) {
                            diagramStatus.textContent = 'Diagram not available for this airport';
                            diagramContainer.innerHTML = `<p style="padding:20px;color:#666;">Try the AOPA link below to find the current airport diagram.</p>`;
                        }
                    });

                if (found) break;
            }
        }

        async function fetchMETAR() {
            try {
                console.log('Fetching METAR...');
                const response = await fetch('https://avwx.rest/api/metar/KSUA?options=info,translate');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('METAR data:', data);

                if (data.raw) {
                    metarDiv.textContent = data.raw;
                } else {
                    metarDiv.textContent = 'METAR: Data unavailable';
                }
            } catch (e) {
                console.error('METAR fetch error:', e);
                metarDiv.innerHTML = '<span class="error-text">Failed to load METAR. Check browser console.</span>';
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const pxPerMile = canvas.width / (RADIUS_MILES * 2);
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < aircraft.length; i++) {
                const ac = aircraft[i];
                const dlat = ac.latitude - USER_LAT;
                const dlon = (ac.longitude - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const distMiles = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * distMiles * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * distMiles * pxPerMile;

                const dist = Math.hypot(clickX - x, clickY - y);
                if (dist < 12) {
                    showAircraftDetail(i);
                    return;
                }
            }

            for (let i = 0; i < AIRPORTS.length; i++) {
                const ap = AIRPORTS[i];
                const dlat = ap.lat - USER_LAT;
                const dlon = (ap.lon - USER_LON) * Math.cos(USER_LAT * Math.PI / 180);
                const distMiles = Math.sqrt(dlat*dlat + dlon*dlon) * 69;
                const bearingRad = Math.atan2(dlon * 69, dlat * 69);
                const radarAngle = bearingRad - Math.PI / 2;

                const x = centerX + Math.cos(radarAngle) * distMiles * pxPerMile;
                const y = centerY + Math.sin(radarAngle) * distMiles * pxPerMile;

                const dist = Math.hypot(clickX - x, clickY - y);
                if (dist < 12) {
                    showAirportDetail(ap.code);
                    return;
                }
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // Initialize
        initMap();
        resizeCanvas();
        updateAirportList();
        fetchAircraft();
        fetchMETAR();

        setInterval(fetchAircraft, 10000);
        setInterval(fetchMETAR, 600000);

        // Log initialization
        console.log('Radar initialized with location:', USER_LAT, USER_LON);
    </script>
</body>
</html>
